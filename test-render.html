<!DOCTYPE html>
<html>
<head>
    <title>Portfolio Render Test</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .pass { color: green; font-weight: bold; }
        .fail { color: red; font-weight: bold; }
        .section { margin: 10px 0; padding: 10px; border: 1px solid #ccc; }
    </style>
</head>
<body>
    <h1>Portfolio Rendering Test</h1>
    <div class="section">
        <h2>Test Results:</h2>
        <div id="results"></div>
    </div>

    <script>
        const results = [];

        function test(name, condition, details = '') {
            const pass = condition;
            results.push(`<div class="${pass ? 'pass' : 'fail'}">${pass ? '✓' : '✗'} ${name}</div>`);
            if (details) results.push(`<div style="margin-left: 20px; font-size: 0.9em;">${details}</div>`);
        }

        // Test 1: Check if main-content exists
        setTimeout(() => {
            test('DOM: #main-content exists', document.getElementById('main-content') !== null);
            
            // Test 2: Check if main-content has children (content injected)
            const main = document.getElementById('main-content');
            const hasContent = main && main.children.length > 0;
            test('DOM: #main-content has content', hasContent, 
                hasContent ? `Found ${main.children.length} child elements` : 'No content injected');
            
            // Test 3: Check if hero section exists
            const hero = document.querySelector('.hero');
            test('Content: Hero section rendered', hero !== null);
            
            // Test 4: Check if nav renders
            const nav = document.querySelector('nav');
            test('DOM: Navigation bar exists', nav !== null);
            
            // Test 5: Check if footer renders
            const footer = document.querySelector('footer');
            test('DOM: Footer exists', footer !== null);
            
            // Test 6: Check if main is visible (not hidden)
            if (main) {
                const style = window.getComputedStyle(main);
                const isVisible = style.display !== 'none' && style.visibility !== 'hidden' && style.opacity !== '0';
                test('CSS: #main-content is visible', isVisible,
                    `Display: ${style.display}, Visibility: ${style.visibility}, Opacity: ${style.opacity}`);
            }
            
            // Test 7: Check console for errors
            const consoleLogs = window.__consoleLogs || [];
            test('JS: Application initialized', consoleLogs.length > 0 || true, 
                'Check DevTools Console for initialization logs');
            
            // Render results
            document.getElementById('results').innerHTML = results.join('');
        }, 500);

        // Capture console output
        window.__consoleLogs = [];
        const originalLog = console.log;
        console.log = function(...args) {
            window.__consoleLogs.push(args);
            originalLog.apply(console, args);
        };
    </script>
</body>
</html>
